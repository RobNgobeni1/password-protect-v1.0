<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protect</title>
    <link rel="icon" href="/src/images/favicon.ico">

    <script src="style.css"></script>
</head>
<body>
    <div id="main-div">
        <form>
            <label for="folder-name">Folder Name : </label>
            <input type="text" id="folder-name"><br><br>

            <label for="password-type">Password Type:</label>
            <select name="password-type" id="password-type">
                <option value="Supply Password">Supply Password</option>
                <option value="Generate Password">Generate Password</option>
            </select><br><br>

            <label for="your-password">Your Password : </label>
            <input type="password" id="your-password"><br><br>

        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
